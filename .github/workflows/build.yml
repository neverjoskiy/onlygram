name: Build Yougram

on:
  push:
    branches: [ master ]
  workflow_dispatch:
  release:
    types: [ created ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # SDK уже предустановлен на раннере; android-actions/setup-android падает,
      # пытаясь ставить удалённый пакет 'tools', поэтому не используем его.
      # Платформа 37 теперь версионируется как android-37.0 (не просто android-37).
      - name: Install SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.22.1"

      # В репозитории нет gradlew — ставим Gradle той же версии, что в gradle-wrapper.properties
      - name: Install Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Create local.properties
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_HOME}
          TG_API_ID=${TG_API_ID:-0}
          TG_API_HASH=${TG_API_HASH}
          UPDATE_URL=https://github.com/julfy-0/Yougram/releases/latest/download/update.json
          KS_PASS=yougram
          EOF

      - name: Build debug and release APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: yougram-apks-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
